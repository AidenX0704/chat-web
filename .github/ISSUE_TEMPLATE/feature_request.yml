name: Feature request / 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 你在什么场景下觉得不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想的方案 / Proposal
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围 / Scope
      options:
        - 纯静态模式
        - 自带后端
        - 两者都要
        - 文档与构建
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
