# 首次申请证书用的临时配置：此时还没有证书，不能出现 443/ssl 指令
# 用法：
#   sudo cp docker/nginx-cert-bootstrap.conf /etc/nginx/conf.d/chat-web.conf
#   sudo nginx -t && sudo nginx -s reload
#   sudo certbot certonly --webroot -w /var/www/certbot -d chat.example.com
# 证书就位后再换成 docker/nginx-host.example.conf（带 443 与跳转）
server {
    listen 80;
    server_name chat.example.com;

    # Let's Encrypt 校验文件写在这里，必须能被公网直接读到
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # 申请期间业务照常可用，也方便直接排查 502 是容器还是代理的问题
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 900s;
    }
}
