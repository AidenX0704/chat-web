# chat-web：宿主 nginx 反向代理到 Docker 里的 web 容器（127.0.0.1:8090）
#
# 用法：换成自己的域名与证书路径后放进 /etc/nginx/conf.d/chat-web.conf，
#       docker compose 里把 WEB_BIND 设为 127.0.0.1（.env），再 nginx -t && nginx -s reload。
#
# 关键点：
#   1. Host 必须原样透传：后端按 Origin 与 Host 比对做同源 CSRF 校验；
#   2. /api 里有 SSE 长连接，必须 proxy_buffering off + 超时加大；
#   3. client_max_body_size 要 ≥ 附件上限（容器内是 120m）。
# HTTP/2 用 `listen 443 ssl http2;` 的兼容写法（nginx ≥ 1.9.5 都认）；
# nginx ≥ 1.25.1 也可以改成 `listen 443 ssl;` + 独立的 `http2 on;` 两行。

# ---- 80：跳转 HTTPS，并给证书续期留位置 ----
server {
    listen 80;
    server_name chat.example.com;

    # certbot --webroot 续期用；不用证书续期可以删掉这一行
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：对外唯一入口 ----
server {
    # 兼容写法：老版本 nginx 没有 `http2 on;` 指令，只能挂在 listen 上
    listen 443 ssl http2;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # 与容器内 client_max_body_size 120m 对齐，否则大附件在这里就被 413 拦掉
    client_max_body_size 120m;

    location / {
        proxy_pass http://127.0.0.1:8090;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 流式回复（SSE）：不缓冲，超时加长，否则回复会攒到最后一次性出现
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
}
