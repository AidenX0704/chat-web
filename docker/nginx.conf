# chat-web 同源部署网关：静态文件 + /api 反向代理
# 后端服务名由 docker-compose 提供（server:8787）

# 延迟解析后端地址：先起 web 后起 server 时 nginx 也能正常启动，
# 后端重启换 IP 后 10 秒内自动跟上，不用重启前端容器。
# resolver 可以写在 http 级；set 只能写在 server / location 里（见下面 server 块）
resolver 127.0.0.11 valid=10s ipv6=off;

# 前面还有一层反代（宿主 nginx / SLB）时沿用它的 X-Forwarded-Proto，
# 否则用本层看到的协议，避免后端以为整条链路都是 http
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # 后端地址放进变量，配合 resolver 做运行时解析（不能写在 http 级）
  set $backend "http://server:8787";

  # 附件上限与后端 PROXY_MAX_BODY_MB（默认 100MB）对齐
  client_max_body_size 120m;

  # 供容器健康检查使用
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # 后端接口
  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
    # SSE 必须关缓冲，否则流式回复会攒到最后一次性出现
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 10s;
    # 长连接：思考 + 长回复可能持续数分钟
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
  }

  # 文件名带内容哈希，可以长期缓存
  location /static/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 入口文件不缓存，升级后刷新即可生效
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # 其余路径交给前端路由
  location / {
    try_files $uri $uri/ /index.html;
  }
}
